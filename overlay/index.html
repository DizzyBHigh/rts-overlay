<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Overlay</title>
  <link rel="stylesheet" href="styles/overlay.css">
</head>
<body>
  <main class="overlay-shell">
    <header>
      <h1>RTS Overlay</h1>
      <span id="status">Disconnected</span>
    </header>

    <section>
      <h2>Configuration</h2>
      <textarea id="configuration" spellcheck="false"></textarea>
      <div class="actions">
        <button id="load">Load from Streamer.bot</button>
        <button id="save">Save to Streamer.bot</button>
      </div>
    </section>

    <section>
      <h2>Panel Test</h2>
      <div id="panel-stage" class="panel-stage"></div>
      <div class="actions">
        <button id="panel-show">Show Panel</button>
        <button id="panel-hide">Hide Panel</button>
      </div>
    </section>

    <section>
      <h2>Message Queue Test</h2>
      <div id="message-test-output" class="message-test-output">Waiting</div>\n      <div id="message-test-count">0 waiting</div>
      <div class="actions">
        <button id="message-enqueue">Queue Message</button>
        <button id="message-clear">Clear Queue</button>
      </div>
    </section>

    <pre id="log"></pre>
  </main>

  <script src="core/runtime.js"></script>
  <script src="core/extensions.js"></script>
  <script src="core/positioning.js"></script>
  <script src="core/animation.js"></script>
  <script src="core/animation-profiles.js"></script>
  <script src="core/websocket.js"></script>
  <script src="core/configuration.js"></script>
  <script src="core/app.js"></script>\n  <script src="core/panels.js"></script>\n  <script src="core/messaging.js"></script>\n  <script src="core/message-presentation.js"></script>\n  <script src="dev/panel-test.js"></script>\n  <script src="dev/message-test.js"></script>
</body>
</html>
